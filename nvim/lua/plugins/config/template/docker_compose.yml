version: '3'    # docker-composeのバージョン指定

services:       # アプリケーションを動かすための各要素
  db:
    images: mysql
  web:
    build: .
    command: bundle exec rails s -p 3000 -b '0.0.0.0'
    volumes:
      - .:/myapp
    ports:
      - "3000:3000"
    depends_on:
      - db


