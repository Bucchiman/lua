name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: directory tree
      run: ls -la

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.x

    - name: Install dependencies
      run: |
        pip install pytest
        #pip install -e ./main
        #pip install -e ./tests

    - name: Run tests
      # Reference: https://github.com/pytest-dev/pytest/issues/2287
      run: python -m pytest -v
